name: Update Cloudflare IP list

on:
  schedule:
    - cron: '0 0 1 * *'  # 1st of every month at 00:00 UTC
  workflow_dispatch:

jobs:
  update-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, openssl
          coverage: none

      - run: composer install --no-dev --no-interaction --prefer-dist

      - name: Download fresh Cloudflare IP ranges
        run: php -r "require 'vendor/autoload.php'; rafalmasiarek\RealIpResolver\IPLists\Cloudflare::updateList();"

      - name: Commit updated list if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/RealIpResolver/data/cloudflare.txt
          git diff-index --quiet HEAD || git commit -m "chore(cloudflare): update IP ranges"

      - uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
